[package]
name = "text-graph"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
description = "Native graph viewer for a folder of markdown notes, with live tmux agent terminals in the graph"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marbinner/text-graph"
homepage = "https://github.com/marbinner/text-graph"
readme = "README.md"
keywords = ["markdown", "graph", "notes", "tmux", "obsidian"]
categories = ["visualization", "gui", "command-line-utilities"]

[features]
default = ["gui"]
gui = [
    "dep:eframe",
    "dep:egui_commonmark",
    "dep:egui_extras",
    "dep:image",
    "dep:notify",
    "dep:syntect",
]

[dependencies]
anyhow = "1"
# glow backend, not the default wgpu: same egui, a fraction of the build
# (wgpu alone was most of an 8GB target dir and minutes of compile time)
eframe = { version = "0.36", optional = true, default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui_commonmark = { version = "0.25", optional = true, features = ["better_syntax_highlighting"] }
# just the image loaders (file:// + decode via the image crate below), so
# markdown previews can render embedded pictures
egui_extras = { version = "0.36", optional = true, default-features = false, features = [
    "file",
    "image",
] }
ignore = "0.4"
# decoders only for the formats the scanner accepts as Image nodes — the
# default feature set drags in AVIF/rayon/etc.
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
notify = { version = "8", optional = true }
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml_ng = "0.10"
smol_str = "0.2"
syntect = { version = "5.3.0", optional = true, default-features = false, features = ["default-fancy"] }
unicode-normalization = "0.1.25"
vt100 = "0.16.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }

# Thin LTO: ~5% on the sim hot loop (measured with perf_probe at 2k
# nodes) for some extra link time. Fat LTO was not worth the build cost.
[profile.release]
lto = "thin"
