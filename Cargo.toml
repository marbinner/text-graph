[package]
name = "text-graph"
version = "0.2.0"
edition = "2024"
description = "Native graph viewer for a folder of markdown notes, with live tmux agent terminals in the graph"
# license: intentionally unset until the author picks one

[dependencies]
anyhow = "1"
# glow backend, not the default wgpu: same egui, a fraction of the build
# (wgpu alone was most of an 8GB target dir and minutes of compile time)
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
egui_commonmark = "0.25"
# just the image loaders (file:// + decode via the image crate below), so
# markdown previews can render embedded pictures
egui_extras = { version = "0.36", default-features = false, features = [
    "file",
    "image",
] }
ignore = "0.4"
# decoders only for the formats the scanner accepts as Image nodes — the
# default feature set drags in AVIF/rayon/etc.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
notify = "8"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
serde_yaml_ng = "0.10"
unicode-normalization = "0.1.25"
vt100 = "0.16.2"

[dev-dependencies]
egui_kittest = { version = "0.36", default-features = false }
