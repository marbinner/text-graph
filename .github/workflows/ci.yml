name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # the tmux integration tests skip-pass without tmux; install it so CI
      # actually exercises the mirror/typing/resize/launch paths
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt -- --check
      - run: cargo check --locked --no-default-features --lib --bin text-graph
      - run: cargo clippy --locked --all-targets -- -D warnings
      # --all-targets compiles benches/examples too, not just lib+bins+tests
      - run: cargo test --locked --all-targets

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # RustSec advisory check over Cargo.lock; fails on known-vulnerable deps
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
